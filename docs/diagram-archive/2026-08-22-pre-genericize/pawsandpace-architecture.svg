<rect x="410.0" y="80.0" width="220.0" height="70.0" rx="6" ry="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
<text x="520.0" y="101.5" text-anchor="middle" font-size="12" font-weight="normal" fill="#000000" style="font-family:'Helvetica Neue',Arial,sans-serif">Routers</text>
<text x="520.0" y="118.5" text-anchor="middle" font-size="12" font-weight="normal" fill="#000000" style="font-family:'Helvetica Neue',Arial,sans-serif">auth, activities, goals,</text>
