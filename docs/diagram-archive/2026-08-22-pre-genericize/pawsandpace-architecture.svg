<text x="520.0" y="418.5" text-anchor="middle" font-size="12" font-weight="normal" fill="#000000" style="font-family:'Helvetica Neue',Arial,sans-serif">cat_repo, cat_form_repo,</text>
<text x="520.0" y="435.5" text-anchor="middle" font-size="12" font-weight="normal" fill="#000000" style="font-family:'Helvetica Neue',Arial,sans-serif">activity_repo</text>
<path d="M 760.0 431.0 L 760.0 489.0 A 90.0 16.0 0 0 0 940.0 489.0 L 940.0 431.0" fill="#f5f5f5" stroke="#666666" stroke-width="1.5"/>
<ellipse cx="850.0" cy="431.0" rx="90.0" ry="16.0" fill="#f5f5f5" stroke="#666666" stroke-width="1.5"/>
<text x="850.0" y="463.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#000000" style="font-family:'Helvetica Neue',Arial,sans-serif">TiDB Cloud</text>
<text x="850.0" y="479.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#000000" style="font-family:'Helvetica Neue',Arial,sans-serif">(MySQL-compatible, SSL)</text>
<text x="46.0" y="551.0" text-anchor="start" font-size="11" font-weight="normal" fill="#666666" style="font-family:'Helvetica Neue',Arial,sans-serif">No third-party integrations found in the backend (no external API calls in services/ or routers/) — a</text>
<text x="46.0" y="567.0" text-anchor="start" font-size="11" font-weight="normal" fill="#666666" style="font-family:'Helvetica Neue',Arial,sans-serif">self-contained stack by design, unlike systems with CRM/notification/AI dispatch dependencies. GPS distance is</text>
<text x="46.0" y="583.0" text-anchor="start" font-size="11" font-weight="normal" fill="#666666" style="font-family:'Helvetica Neue',Arial,sans-serif">computed client-side (mobile/src/services/haversine.ts); the server only trusts the submitted activity payload.</text>
<text x="46.0" y="599.0" text-anchor="start" font-size="11" font-weight="normal" fill="#666666" style="font-family:'Helvetica Neue',Arial,sans-serif">Verified 2026-08-20 against backend/app/config.py, routers/*.py, services/game_engine_service.py,</text>
<text x="46.0" y="615.0" text-anchor="start" font-size="11" font-weight="normal" fill="#666666" style="font-family:'Helvetica Neue',Arial,sans-serif">repositories/*.py.</text>
