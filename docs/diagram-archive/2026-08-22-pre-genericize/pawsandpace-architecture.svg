<text x="520.0" y="305.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#000000" style="font-family:'Helvetica Neue',Arial,sans-serif">game_engine_service</text>
<text x="520.0" y="322.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#000000" style="font-family:'Helvetica Neue',Arial,sans-serif">(hunger decay, evolution,</text>
