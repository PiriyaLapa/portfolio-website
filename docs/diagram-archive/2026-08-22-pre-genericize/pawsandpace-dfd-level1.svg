<text x="306.0" y="964.0" text-anchor="start" font-size="11" font-weight="normal" fill="#666666" style="font-family:'Helvetica Neue',Arial,sans-serif">3.0 Update Cat State is the "Hunger Engine" — the one process every other flow ultimately feeds. No manual data-entry review step exists (contrast with systems requiring an</text>
<text x="306.0" y="980.0" text-anchor="start" font-size="11" font-weight="normal" fill="#666666" style="font-family:'Helvetica Neue',Arial,sans-serif">upload-conflict resolution step) since GPS data is submitted directly by the authenticated user. Goal progress (actual_value) is client-submitted via PATCH, not</text>
<text x="306.0" y="996.0" text-anchor="start" font-size="11" font-weight="normal" fill="#666666" style="font-family:'Helvetica Neue',Arial,sans-serif">server-aggregated from Activities — there is no automatic link from D4 to 4.0, unlike the Hunger Engine's D2/D3 reads. Verified 2026-08-20 against routers/activities.py</text>
<text x="306.0" y="1012.0" text-anchor="start" font-size="11" font-weight="normal" fill="#666666" style="font-family:'Helvetica Neue',Arial,sans-serif">(P2/P3), services/game_engine_service.py (P3), routers/goals.py (P4, confirms actual_value comes from request body), routers/profile.py + activities.py (P5).</text>
