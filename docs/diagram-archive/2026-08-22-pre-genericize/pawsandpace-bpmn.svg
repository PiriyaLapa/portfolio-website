<text x="46.0" y="567.0" text-anchor="start" font-size="11" font-weight="normal" fill="#666666" style="font-family:'Helvetica Neue',Arial,sans-serif">No conflict/approval gateway exists before the commit (contrast with systems requiring a send-enabled kill switch or date-range overlap check) —</text>
<text x="46.0" y="583.0" text-anchor="start" font-size="11" font-weight="normal" fill="#666666" style="font-family:'Helvetica Neue',Arial,sans-serif">the write is unconditional once JWT-authenticated. hunger is capped at 100 after decay+restore, mood is re-derived every write, never stored</text>
<text x="46.0" y="599.0" text-anchor="start" font-size="11" font-weight="normal" fill="#666666" style="font-family:'Helvetica Neue',Arial,sans-serif">independently of hunger. Verified 2026-08-20 against routers/activities.py, services/game_engine_service.py.</text>
